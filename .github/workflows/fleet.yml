name: Fleet

on:
  workflow_dispatch:
    inputs:
      guest:
        description: guest slot name (g1, w1), or spare
        required: true
        default: g1
        type: string
      mode:
        description: run, or install (Windows install spike)
        required: false
        default: run
        type: string
      mem_mb:
        description: RAM in MB, blank for the guest default
        required: false
        default: ''
        type: string

run-name: Fleet ${{ inputs.guest }}

env:
  GH_OWNER: ${{ github.repository_owner }}
  PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
  RUNNER_REPO_NAME: ${{ github.event.repository.name }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  SHIM_PAT: ${{ secrets.SHIM_PAT }}
  SHIM_BOT_TOKEN: ${{ secrets.SHIM_BOT_TOKEN }}
  SHIM_OWNER_CHAT_ID: ${{ secrets.SHIM_OWNER_CHAT_ID }}

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    concurrency:
      group: fleet-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Prepare
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf
          sudo chmod 666 /dev/kvm || true
          sudo pip3 install -q --break-system-packages 'websockets==13.1' || sudo pip3 install -q --break-system-packages 'websockets==13.1'
          sudo curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && sudo chmod +x /usr/local/bin/cloudflared || true
          git clone -q --depth 1 "https://x-access-token:${SHIM_PAT}@github.com/${GH_OWNER}/${PRIVATE_REPO_NAME}.git" /home/runner/shim-src
      - name: Host agent
        run: |
          case "${{ inputs.guest }}" in w*|spare) sudo mkdir -p /mnt/fleet && sudo chown "$(id -u):$(id -g)" /mnt/fleet && export FLEET_WORK=/mnt/fleet;; esac
          python3 /home/runner/shim-src/vps-shim/host/fleet_host.py "${{ inputs.mode || 'run' }}" --guest "${{ inputs.guest }}" --mem "${{ inputs.mem_mb || '0' }}"
